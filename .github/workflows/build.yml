name: Build and publish with Nix

on:
  push:
    branches: ['main', 'nix']

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is derived dynamically and lowercased below

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with Nix
        id: build_image
        run: |
          image_path=$(nix build .#dockerImage --print-out-paths)
          echo "image_path=${image_path}" >> $GITHUB_OUTPUT

      - name: Load Nix-built image into Docker
        id: load_image
        run: |
          loaded_image_id=$(docker load < ${{ steps.build_image.outputs.image_path }} | sed -n 's/^Loaded image ID: sha256:\([0-9a-f]*\).*$/\1/p')
          # Sometimes 'docker load' outputs "Loaded image: <name>:<tag>"
          if [ -z "$loaded_image_id" ]; then
            loaded_image_name_tag=$(docker load < ${{ steps.build_image.outputs.image_path }} | sed -n 's/^Loaded image: \(.*\)$/\1/p')
            # Use the name:tag reported by docker load if ID wasn't captured directly
            echo "loaded_name_tag=${loaded_image_name_tag}" >> $GITHUB_OUTPUT
          else
             # If we got the ID, construct a temporary name:tag based on it for metadata action
             echo "loaded_name_tag=localbuild:${loaded_image_id:0:12}" >> $GITHUB_OUTPUT
             docker tag $loaded_image_id localbuild:${loaded_image_id:0:12}
          fi


      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }} # Action handles lowercasing
          # Use the image loaded into the docker daemon
          # We use the name:tag we determined in the previous step
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch # Tag with branch name
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha # Tag with commit SHA

      # Debug: Print tags
      - name: Print tags
        run: echo "${{ steps.meta.outputs.tags }}"

      # Tag the loaded image with the metadata tags
      - name: Tag loaded image
        run: |
          # Use the name:tag determined during load
          SOURCE_IMAGE="${{ steps.load_image.outputs.loaded_name_tag }}"
          # Iterate over the tags generated by metadata-action
          echo "${{ steps.meta.outputs.tags }}" | sed 's/,/\n/g' | while read tag; do
            echo "Tagging ${SOURCE_IMAGE} as ${tag}"
            docker tag "${SOURCE_IMAGE}" "${tag}"
          done

      # Push all tags
      - name: Push image
        run: |
          echo "${{ steps.meta.outputs.tags }}" | sed 's/,/\n/g' | while read tag; do
            echo "Pushing ${tag}"
            docker push "${tag}"
          done

